.slogan { margin-top: 26px; font: 400 40px/1.2 "Inter", sans-serif; letter-spacing: -0.012em; color: var(--sub); }

.tl { width: 11px; height: 11px; border-radius: 50%; }

.url { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); width: 320px; height: 22px; border-radius: 6px; background: #e9e9eb;

.url svg { fill: #8a8a8e; color: #8a8a8e; }
.screen img { position: absolute; top: 34px; left: 0; width: 966px; display: block; }

.pscreen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 34px; background: linear-gradient(90deg, #fff7f5, #fef1ee); }

.island { position: absolute; top: 17px; left: 50%; width: 64px; height: 20px; margin-left: -32px; border-radius: 11px; background: #000; }
.pfade { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #fff 55%); }
.home { position: absolute; bottom: 6px; left: 50%; width: 76px; height: 4px; margin-left: -38px; border-radius: 2px; background: rgba(29,29,31,.85); }
.pglare { position: absolute; inset: 0; border-radius: 34px; background: linear-gradient(125deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 30%); pointer-events: none; }
