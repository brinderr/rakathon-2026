# eKoordinace → Vercel: every push to main that touches ekoordinace/ is checked, built and deployed to production.
# Works with the private repo and with any commit author. Needs one repository secret: VERCEL_TOKEN (a Vercel token
# for the team "Matej Salat's projects"). Without the secret the deploy job is skipped, not failed.
name: eKoordinace → Vercel

on:
  push:
    branches: [main]
    paths: ['ekoordinace/**', '.github/workflows/ekoordinace-vercel.yml']
  workflow_dispatch:

concurrency:
  group: ekoordinace-vercel
  cancel-in-progress: true

jobs:
  token:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: echo "ok=$([ -n "$VERCEL_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: token
    if: needs.token.outputs.ok == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ekoordinace
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SCOPE: matej-salats-projects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ekoordinace/package-lock.json
      - run: npm ci
      - run: npm run check # typecheck + build into dist/
      - name: Deploy dist/ to the Vercel project "ekoordinace"
        run: |
          npx --yes vercel@latest link --yes --project ekoordinace --scope "$SCOPE" --token "$VERCEL_TOKEN" --cwd dist
          url=$(npx --yes vercel@latest deploy --prod --yes --scope "$SCOPE" --token "$VERCEL_TOKEN" --cwd dist)
          echo "Nasadené: $url" >> "$GITHUB_STEP_SUMMARY"
